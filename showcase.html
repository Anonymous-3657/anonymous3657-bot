  <style>

      FileSpreadsheet: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></svg>,
      Globe: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>,

      CheckCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>,

      { icon: Icons.Settings, title: "Platform Settings", desc: "Configure registration, maintenance mode, upload limits, auto-approve, and contact information.", color: "from-gray-500 to-slate-500", demo: "/login-demo.html#settings" },
      { icon: Icons.FileSpreadsheet, title: "CSV Export", desc: "Export all PDF records as CSV with filtering by status. Includes metadata, downloads, and uploader info.", color: "from-emerald-500 to-teal-500", demo: "/login-demo.html#export" },
      { icon: Icons.Globe, title: "Public Downloads", desc: "Browse and download approved PDFs without login. Search, filter by subject/semester, and sort by popularity.", color: "from-cyan-500 to-blue-500", demo: "/login-demo.html#public" },
      { icon: Icons.Sparkles, title: "Animated Login Page", desc: "71 motion elements with floating particles, drifting gradient orbs, staggered field entrance, and focus glow effects.", color: "from-blue-600 to-indigo-600", demo: "/login-demo.html" },
      { icon: Icons.Moon, title: "Theme Toggle", desc: "Dark/Light mode switch with persistent storage. Smooth transitions and system preference detection.", color: "from-violet-500 to-purple-500", demo: "/login-demo.html#theme" },
    ];

    // ─── Stat Counter Animation ───────────────────────────────
    function AnimatedCounter({ target, duration = 2 }) {
      const [count, setCount] = useState(0);
      useEffect(() => {
        let start = 0;
        const end = target;
        const stepTime = Math.abs(Math.floor(duration * 1000 / end));
        const timer = setInterval(() => {
          start += 1;
          setCount(start);
          if (start >= end) clearInterval(timer);
        }, stepTime);
        return () => clearInterval(timer);
      }, [target, duration]);
      return <span>{count.toLocaleString()}</span>;
    }

    // ─── Main App ─────────────────────────────────────────────
    function App() {

      return (

                </motion.div>
                <motion.button initial={{ opacity: 0 }} animate={{ opacity: 1 }}

                  className="grid h-10 w-10 place-items-center rounded-xl border border-brand-line bg-brand-surface text-muted hover:text-fg transition-colors">
                  {theme === "dark" ? <Icons.Sun /> : <Icons.Moon />}

                className="text-center max-w-4xl mx-auto">
                <motion.div initial={{ scale: 0.8 }} animate={{ scale: 1 }} transition={{ type: "spring", stiffness: 200, delay: 0.2 }}
                  className="inline-flex items-center gap-2 rounded-full border border-brand-primary/30 bg-brand-primary/10 px-4 py-1.5 mb-6">
                  <Icons.Sparkles />
                  <span className="text-sm font-medium text-brand-primary">15+ Features Implemented</span>
                </motion.div>
                <h1 className="font-heading text-4xl sm:text-5xl md:text-6xl font-bold tracking-tight">
                  <span className="text-brand-fg">All Features </span>

                <p className="mt-6 text-lg text-brand-muted max-w-2xl mx-auto">
                  Complete implementation of notifications, profiles, ratings, comments, analytics, bulk actions, announcements, settings, public downloads, and more.

                {/* Stats Row */}
                <div className="mt-10 grid grid-cols-2 sm:grid-cols-4 gap-4">
                  {[
                    { label: "Lines of Code", value: 6301, suffix: "+" },
                    { label: "Files Changed", value: 35, suffix: "" },
                    { label: "API Endpoints", value: 25, suffix: "+" },
                    { label: "Components", value: 15, suffix: "+" },

            </div>
          </section>

          {/* Features Grid */}

              className="font-heading text-2xl font-bold text-center mb-10">

            <div className="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">

                      </div>
                      <div className="min-w-0">

          {/* Footer */}
          <footer className="border-t border-brand-line py-8">

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</body>
