<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CG Student Portal — Animated Login Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#090e18',
              surface: '#111827',
              elevated: '#161b26',
              line: '#1f2937',
              fg: '#ffffff',
              muted: '#94a3b8',
              primary: '#2563eb',
              primaryDark: '#1e40af',
              accent: '#f59e0b',
              accent2: '#6366f1',
              success: '#22c55e',
              warning: '#f59e0b',
              error: '#ef4444',
              info: '#38bdf8',
            },
          },
          fontFamily: {
            heading: ['Poppins', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090e18;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    .font-heading { font-family: 'Poppins', sans-serif; }
    input::placeholder { color: rgba(148, 163, 184, 0.5); }
    input:focus { outline: none; border-color: #2563eb; }
    input[type="checkbox"] { accent-color: #2563eb; }
    .grain {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    }
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-slow { animation: spin-slow 20s linear infinite; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { motion, AnimatePresence } = window["framer-motion"] || FramerMotion;

    // ─── Icons (simple SVG components) ────────────────────────
    const IconMail = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
    );
    const IconLock = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    );
    const IconEye = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
    );
    const IconEyeOff = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
    );
    const IconSparkles = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>
    );
    const IconCheck = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#22c55e" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
    );
    const IconFileText = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
    );
    const IconBook = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
    );
    const IconGrad = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg>
    );
    const IconShield = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
    );

    // ─── Floating cards data ──────────────────────────────
    const FLOATING = [
      { icon: IconFileText, label: "Question Papers", x: "6%", y: "18%", delay: 0 },
      { icon: IconBook, label: "Semester Notes", x: "58%", y: "8%", delay: 0.15 },
      { icon: IconGrad, label: "Course Syllabus", x: "20%", y: "62%", delay: 0.3 },
      { icon: IconShield, label: "Verified Uploads", x: "62%", y: "70%", delay: 0.45 },
    ];

    const PARTICLES = Array.from({ length: 18 }, (_, i) => ({
      id: i, size: 2 + (i % 3), x: (i * 37) % 100, y: (i * 53) % 100,
      duration: 12 + (i % 5) * 2, delay: (i % 6) * 0.6,
    }));

    // ─── Field animation variants ──────────────────────
    const fieldVariants = {
      hidden: { opacity: 0, y: 18, filter: "blur(4px)" },
      visible: (i) => ({
        opacity: 1, y: 0, filter: "blur(0px)",
        transition: { delay: 0.35 + i * 0.08, duration: 0.55, ease: [0.22, 1, 0.36, 1] },
      }),
    };

    // ─── Password field with toggle ────────────────────
    function PasswordField({ id, label, value, onChange, placeholder }) {
      const [visible, setVisible] = useState(false);
      return (
        <div>
          <label htmlFor={id} className="font-heading text-sm font-medium text-brand-fg">{label}</label>
          <div className="relative mt-2">
            <input id={id} type={visible ? "text" : "password"} value={value} onChange={onChange}
              placeholder={placeholder}
              className="w-full min-h-[48px] rounded-xl border border-brand-line bg-brand-elevated px-4 pr-14 text-sm text-brand-fg transition-colors duration-200" />
            <button type="button" onClick={() => setVisible(v => !v)}
              className="absolute right-1.5 top-1/2 -translate-y-1/2 grid h-10 w-10 place-items-center rounded-lg text-brand-muted hover:text-brand-fg transition-colors">
              {visible ? <IconEyeOff /> : <IconEye />}
            </button>
          </div>
        </div>
      );
    }

    // ─── Main Login Page ───────────────────────────────
    function LoginPage() {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [remember, setRemember] = useState(true);
      const [acceptTerms, setAcceptTerms] = useState(false);
      const [acceptPrivacy, setAcceptPrivacy] = useState(false);
      const [error, setError] = useState("");
      const [busy, setBusy] = useState(false);
      const [shake, setShake] = useState(0);
      const [done, setDone] = useState(false);

      const onSubmit = async (e) => {
        e.preventDefault();
        setError("");
        if (!acceptTerms || !acceptPrivacy) {
          setError("Please accept the Terms & Conditions and Privacy Policy to continue.");
          setShake(s => s + 1);
          return;
        }
        if (!email || !password) {
          setError("Please enter your email and password.");
          setShake(s => s + 1);
          return;
        }
        setBusy(true);
        // Simulate API call
        setTimeout(() => {
          setBusy(false);
          setDone(true);
        }, 1800);
      };

      const shakeAnimation = !shake ? {} : {
        x: [0, -14, 12, -10, 8, -4, 4, 0],
        rotate: [0, -1.5, 1.2, -0.8, 0.5, 0],
      };

      return (
        <div className="min-h-screen bg-brand-bg lg:grid lg:grid-cols-[1.05fr_1fr]">
          {/* ─── Brand Side ────────────────────────────── */}
          <section className="relative hidden overflow-hidden border-r border-brand-line lg:block">
            <div className="absolute inset-0" aria-hidden="true">
              <div className="grain absolute inset-0 opacity-60" />

              {/* Drifting gradient orbs */}
              <motion.div className="absolute -left-20 top-24 h-72 w-72 rounded-full bg-brand-primary/25 blur-[120px]"
                animate={{ x: [0, 40, -20, 0], y: [0, 30, -10, 0], scale: [1, 1.1, 0.95, 1] }}
                transition={{ duration: 14, repeat: Infinity, ease: "easeInOut" }} />
              <motion.div className="absolute -right-10 bottom-10 h-72 w-72 rounded-full bg-brand-accent2/20 blur-[130px]"
                animate={{ x: [0, -30, 20, 0], y: [0, -20, 15, 0], scale: [1, 0.9, 1.1, 1] }}
                transition={{ duration: 16, repeat: Infinity, ease: "easeInOut", delay: 1 }} />
              <motion.div className="absolute left-1/3 top-1/2 h-56 w-56 rounded-full bg-brand-accent/15 blur-[110px]"
                animate={{ x: [0, 50, -30, 0], y: [0, -40, 20, 0] }}
                transition={{ duration: 18, repeat: Infinity, ease: "easeInOut", delay: 2 }} />

              {/* Floating particles */}
              {PARTICLES.map((p) => (
                <motion.span key={p.id} className="absolute rounded-full bg-brand-primary/40"
                  style={{ left: `${p.x}%`, top: `${p.y}%`, width: p.size, height: p.size }}
                  animate={{ y: [0, -30, 0, 20, 0], x: [0, 15, -10, 5, 0], opacity: [0.2, 0.8, 0.4, 0.9, 0.2] }}
                  transition={{ duration: p.duration, repeat: Infinity, ease: "easeInOut", delay: p.delay }} />
              ))}

              {/* Floating feature cards */}
              {FLOATING.map((card, i) => {
                const Icon = card.icon;
                return (
                  <motion.div key={card.label}
                    className="absolute flex items-center gap-2.5 rounded-2xl border border-brand-line bg-brand-surface/80 px-4 py-3 backdrop-blur-md"
                    style={{ left: card.x, top: card.y }}
                    initial={{ opacity: 0, y: 30, scale: 0.9 }}
                    animate={{ opacity: 1, y: [0, -14, 0], scale: 1 }}
                    transition={{
                      opacity: { duration: 0.7, delay: 0.3 + i * 0.15 },
                      y: { duration: 7 + i, repeat: Infinity, ease: "easeInOut", delay: card.delay },
                      scale: { duration: 0.7, delay: 0.3 + i * 0.15, ease: [0.22, 1, 0.36, 1] },
                    }}>
                    <motion.div animate={{ rotate: [0, 8, -8, 0] }}
                      transition={{ duration: 6, repeat: Infinity, ease: "easeInOut", delay: i * 0.5 }}>
                      <span className="text-brand-primary"><Icon /></span>
                    </motion.div>
                    <span className="font-heading text-xs text-brand-fg">{card.label}</span>
                  </motion.div>
                );
              })}
            </div>

            <div className="relative flex h-full flex-col justify-between p-12">
              <motion.div initial={{ opacity: 0, y: -20 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.7 }}>
                <div className="flex items-center gap-3">
                  <div className="h-10 w-10 rounded-xl bg-gradient-to-br from-brand-primary to-brand-accent2 grid place-items-center">
                    <span className="font-heading text-white font-bold text-lg">C</span>
                  </div>
                  <div>
                    <p className="font-heading text-sm font-semibold text-brand-fg">CG STUDENT PORTAL</p>
                    <p className="text-xs text-brand-muted">Study • Earn • Grow</p>
                  </div>
                </div>
              </motion.div>

              <motion.div initial={{ opacity: 0, x: -30 }} animate={{ opacity: 1, x: 0 }}
                transition={{ duration: 0.8, delay: 0.2, ease: [0.22, 1, 0.36, 1] }} className="max-w-md">
                <h2 className="font-heading text-4xl font-bold leading-tight tracking-tight text-brand-fg">
                  One Platform.<br />
                  <span className="text-brand-primary">Every Student.</span>
                </h2>
                <p className="mt-5 text-sm text-brand-muted">
                  The official EdTech platform for Chhattisgarh students — notes, question papers, syllabus, AI study help, and more.
                </p>
              </motion.div>

              <motion.p initial={{ opacity: 0 }} animate={{ opacity: 1 }} transition={{ duration: 0.8, delay: 0.6 }}
                className="text-xs text-brand-muted/70">
                Study • Earn • Grow
              </motion.p>
            </div>
          </section>

          {/* ─── Form Side ─────────────────────────────── */}
          <section className="relative flex min-h-screen flex-col px-5 py-8 sm:px-10">
            {/* Mobile background glow */}
            <div className="pointer-events-none absolute inset-0 overflow-hidden lg:hidden" aria-hidden="true">
              <motion.div className="absolute -top-20 left-1/2 h-80 w-80 -translate-x-1/2 rounded-full bg-brand-primary/15 blur-[120px]"
                animate={{ scale: [1, 1.1, 1], opacity: [0.5, 0.8, 0.5] }}
                transition={{ duration: 8, repeat: Infinity, ease: "easeInOut" }} />
            </div>

            {/* Mobile logo */}
            <div className="lg:hidden">
              <motion.div initial={{ opacity: 0, y: -10 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.5 }}>
                <div className="flex items-center gap-3">
                  <div className="h-10 w-10 rounded-xl bg-gradient-to-br from-brand-primary to-brand-accent2 grid place-items-center">
                    <span className="font-heading text-white font-bold text-lg">C</span>
                  </div>
                  <p className="font-heading text-sm font-semibold text-brand-fg">CG STUDENT PORTAL</p>
                </div>
              </motion.div>
            </div>

            <motion.div initial={{ opacity: 0, y: 16 }} animate={{ opacity: 1, y: 0 }}
              transition={{ duration: 0.5, ease: [0.22, 1, 0.36, 1] }}
              className="relative mx-auto flex w-full max-w-md flex-1 flex-col justify-center py-10">

              <motion.div className="relative rounded-[20px] border border-brand-line bg-brand-surface/90 p-7 shadow-[0_24px_70px_-40px_rgba(0,0,0,0.9)] backdrop-blur-xl sm:p-9"
                whileHover={{ y: -2, transition: { duration: 0.3 } }}>
                <div className="relative">
                  <motion.h1 className="font-heading text-2xl font-semibold tracking-tight text-brand-fg"
                    initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.5, delay: 0.1 }}>
                    Welcome back
                  </motion.h1>
                  <motion.p className="mt-2 text-sm text-brand-muted"
                    initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.5, delay: 0.2 }}>
                    Continue your learning journey.
                  </motion.p>

                  <div className="mt-8">
                    {/* Animated orb + logo badge */}
                    <div className="relative mx-auto mb-6 flex h-16 w-16 items-center justify-center" aria-hidden="true">
                      <motion.span className="absolute inset-0 rounded-full border-2 border-brand-primary/40"
                        animate={{ scale: [1, 1.25, 1], opacity: [0.6, 0, 0.6] }}
                        transition={{ duration: 2.5, repeat: Infinity, ease: "easeOut" }} />
                      <motion.span className="absolute inset-0 rounded-full bg-gradient-to-br from-brand-primary via-brand-primaryDark to-brand-accent2"
                        style={{ animation: "spin-slow 20s linear infinite" }} />
                      <span className="absolute inset-[2px] rounded-full bg-brand-surface" />
                      <motion.div animate={{ y: [0, -3, 0] }} transition={{ duration: 2.4, repeat: Infinity, ease: "easeInOut" }}>
                        <span className="relative text-brand-primary">{done ? <IconCheck /> : <IconSparkles />}</span>
                      </motion.div>
                    </div>

                    <motion.form onSubmit={onSubmit} noValidate key={shake}
                      animate={shakeAnimation} transition={{ duration: 0.55, ease: "easeInOut" }}
                      className="relative space-y-5">

                      {/* Email */}
                      <motion.div custom={0} variants={fieldVariants} initial="hidden" animate="visible" className="group relative">
                        <div className="pointer-events-none absolute left-4 top-[50px] z-10 text-brand-muted transition-colors duration-200 group-focus-within:text-brand-primary">
                          <IconMail />
                        </div>
                        <label htmlFor="email" className="font-heading text-sm font-medium text-brand-fg">Email</label>
                        <input id="email" type="email" value={email} onChange={e => setEmail(e.target.value)}
                          placeholder="you@example.com"
                          className="mt-2 w-full min-h-[48px] rounded-xl border border-brand-line bg-brand-elevated pl-11 pr-4 text-sm text-brand-fg transition-colors duration-200" />
                        <motion.span className="pointer-events-none absolute -inset-1 rounded-xl opacity-0 transition-opacity duration-300 group-focus-within:opacity-100"
                          style={{ boxShadow: "0 0 0 3px rgba(37,99,235,0.18), 0 0 20px rgba(37,99,235,0.08)" }} />
                      </motion.div>

                      {/* Password */}
                      <motion.div custom={1} variants={fieldVariants} initial="hidden" animate="visible" className="group relative">
                        <div className="pointer-events-none absolute left-4 top-[50px] z-10 text-brand-muted transition-colors duration-200 group-focus-within:text-brand-primary">
                          <IconLock />
                        </div>
                        <PasswordField id="password" label="Password" value={password}
                          onChange={e => setPassword(e.target.value)} placeholder="••••••••" />
                        <div className="absolute left-4 top-[46px] z-10 text-brand-muted transition-colors duration-200 group-focus-within:text-brand-primary pointer-events-none">
                          <IconLock />
                        </div>
                        <motion.span className="pointer-events-none absolute -inset-1 rounded-xl opacity-0 transition-opacity duration-300 group-focus-within:opacity-100"
                          style={{ boxShadow: "0 0 0 3px rgba(37,99,235,0.18), 0 0 20px rgba(37,99,235,0.08)" }} />
                      </motion.div>

                      {/* Divider */}
                      <motion.div custom={2} variants={fieldVariants} initial="hidden" animate="visible">
                        <motion.span className="block h-px bg-gradient-to-r from-transparent via-brand-line to-transparent"
                          initial={{ scaleX: 0 }} animate={{ scaleX: 1 }}
                          transition={{ duration: 0.8, delay: 0.6, ease: "easeOut" }} />
                      </motion.div>

                      {/* Remember / Forgot */}
                      <motion.div custom={3} variants={fieldVariants} initial="hidden" animate="visible"
                        className="flex items-center justify-between gap-4">
                        <label className="flex min-h-[44px] cursor-pointer items-center gap-2.5 text-sm text-brand-muted hover:text-brand-fg transition-colors">
                          <motion.span whileTap={{ scale: 0.9 }} className="inline-flex">
                            <input type="checkbox" checked={remember} onChange={e => setRemember(e.target.checked)}
                              className="h-4 w-4" />
                          </motion.span>
                          Remember me
                        </label>
                        <a href="#" className="text-sm font-medium text-brand-primary hover:text-brand-fg transition-colors">
                          Forgot password?
                        </a>
                      </motion.div>

                      {/* Terms */}
                      <motion.div custom={4} variants={fieldVariants} initial="hidden" animate="visible"
                        className="space-y-1 border-t border-brand-line pt-4">
                        <label className="flex min-h-[44px] cursor-pointer items-start gap-3 text-sm text-brand-muted">
                          <input type="checkbox" checked={acceptTerms} onChange={e => setAcceptTerms(e.target.checked)}
                            className="mt-0.5 h-4 w-4 shrink-0" />
                          <span>I accept the <a href="#" className="text-brand-primary hover:text-brand-fg">Terms &amp; Conditions</a></span>
                        </label>
                        <label className="flex min-h-[44px] cursor-pointer items-start gap-3 text-sm text-brand-muted">
                          <input type="checkbox" checked={acceptPrivacy} onChange={e => setAcceptPrivacy(e.target.checked)}
                            className="mt-0.5 h-4 w-4 shrink-0" />
                          <span>I accept the <a href="#" className="text-brand-primary hover:text-brand-fg">Privacy Policy</a></span>
                        </label>
                      </motion.div>

                      {/* Error alert */}
                      <AnimatePresence mode="wait">
                        {error && (
                          <motion.div key={`err-${shake}`}
                            initial={{ opacity: 0, y: -8, scale: 0.96 }}
                            animate={{ opacity: 1, y: 0, scale: 1 }}
                            exit={{ opacity: 0, y: -8, scale: 0.96 }}
                            transition={{ duration: 0.3 }}>
                            <p className="rounded-xl border border-brand-error/40 bg-brand-error/10 px-4 py-3 text-sm text-brand-error">
                              {error}
                            </p>
                          </motion.div>
                        )}
                      </AnimatePresence>

                      {/* Success alert */}
                      <AnimatePresence>
                        {done && (
                          <motion.div initial={{ opacity: 0, scale: 0.9, y: -6 }}
                            animate={{ opacity: 1, scale: 1, y: 0 }}
                            transition={{ duration: 0.4, ease: [0.22, 1, 0.36, 1] }}>
                            <p className="rounded-xl border border-brand-success/40 bg-brand-success/10 px-4 py-3 text-sm text-brand-success flex items-center gap-2">
                              <motion.span initial={{ scale: 0, rotate: -90 }}
                                animate={{ scale: 1, rotate: 0 }}
                                transition={{ type: "spring", stiffness: 200, damping: 12, delay: 0.1 }}>
                                <IconCheck />
                              </motion.span>
                              Signed in. Taking you to your dashboard…
                            </p>
                          </motion.div>
                        )}
                      </AnimatePresence>

                      {/* Submit */}
                      <motion.div custom={5} variants={fieldVariants} initial="hidden" animate="visible">
                        <motion.div whileTap={{ scale: 0.98 }} transition={{ duration: 0.1 }}>
                          <button type="submit" disabled={busy || done}
                            className="inline-flex min-h-[48px] w-full items-center justify-center gap-2 rounded-xl bg-brand-primary font-heading text-sm font-medium text-white transition-colors hover:bg-brand-primaryDark disabled:opacity-60">
                            {busy ? (
                              <>
                                <span className="h-4 w-4 animate-spin rounded-full border-2 border-white/40 border-t-white" />
                                Signing
                                <motion.span animate={{ opacity: [0.4, 1, 0.4] }} transition={{ duration: 1.2, repeat: Infinity }}>…</motion.span>
                              </>
                            ) : done ? (
                              <>Signed in ✓</>
                            ) : (
                              <>Sign In <motion.span animate={{ x: [0, 3, 0] }} transition={{ duration: 1.5, repeat: Infinity, ease: "easeInOut" }}>→</motion.span></>
                            )}
                          </button>
                        </motion.div>
                      </motion.div>

                      <motion.p custom={6} variants={fieldVariants} initial="hidden" animate="visible"
                        className="text-center text-xs text-brand-muted/60">
                        Google sign-in is not enabled yet on this platform.
                      </motion.p>
                    </motion.form>
                  </div>
                </div>
              </motion.div>

              <motion.div className="mt-6 text-center text-sm text-brand-muted"
                initial={{ opacity: 0 }} animate={{ opacity: 1 }} transition={{ delay: 0.5 }}>
                Don't have an account?{" "}
                <a href="#" className="font-medium text-brand-primary hover:text-brand-fg hover:underline underline-offset-4">Create Account</a>
              </motion.div>

              <motion.p className="mt-8 text-center text-xs text-brand-muted/60"
                initial={{ opacity: 0 }} animate={{ opacity: 1 }} transition={{ delay: 0.6 }}>
                <a href="#" className="hover:text-brand-fg transition-colors">Back to CG STUDENT PORTAL</a>
              </motion.p>
            </motion.div>
          </section>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<LoginPage />);
  </script>
</body>
</html>
